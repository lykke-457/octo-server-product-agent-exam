name: Feature / 需求
labels: ["type/feature", "status/new", "source/exam-group"]
description: 记录 octo-server 新需求或增强建议
body:
  - type: textarea
    id: original
    attributes:
      label: 用户原始需求
      description: 必须保留原话，不改写、不脑补。
      placeholder: 粘贴用户/考官原话
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 用户目标
      placeholder: 用户希望完成什么、解决什么问题
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 范围初判
      placeholder: 包含什么 / 不包含什么 / 是否需要 PRD
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 证据 / 来源
      description: 如涉及源码结论，必须使用 来源: <相对路径>#L<起>-L<止>
      placeholder: "来源: modules/example/file.go#L10-L25"
    validations:
      required: false
  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      options:
        - priority/P0
        - priority/P1
        - priority/P2
        - priority/P3
    validations:
      required: true
